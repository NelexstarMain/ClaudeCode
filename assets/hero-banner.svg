<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow-purple)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <!-- Top Accent Bar -->
  <path d="M 16 1 Q 600 1 1184 1" stroke="url(#accent)" stroke-width="2.5" fill="none"/>

  <!-- Logo Icon Container -->
  <g transform="translate(60, 48)">
    <rect width="68" height="68" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Terminal / Shield Icon -->
    <path d="M 22 26 L 34 34 L 22 42" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="38" y1="42" x2="48" y2="42" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="20" r="3" fill="#10b981"/>
  </g>

  <!-- Header Title -->
  <text x="148" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    Claude Code <tspan fill="url(#accent)">Hygiene System</tspan>
  </text>
  <text x="148" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
    Autonomiczny framework dyscypliny TDD, kontroli okna kontekstu i higieny kodu dla <tspan fill="#e2e8f0" font-family="ui-monospace, monospace">~/.claude/</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Feature Pills Row -->
  <g transform="translate(60, 164)">
    <!-- Pill 1: Python Stdlib -->
    <g transform="translate(0, 0)">
      <rect width="195" height="38" rx="19" fill="url(#badge-bg)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Python 3 Stdlib (Zero Deps)</text>
    </g>

    <!-- Pill 2: Smart TDD Guard -->
    <g transform="translate(210, 0)">
      <rect width="185" height="38" rx="19" fill="url(#badge-bg)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#10b981"/>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Smart TDD Gate (Stop)</text>
    </g>

    <!-- Pill 3: Context Sentinel -->
    <g transform="translate(410, 0)">
      <rect width="205" height="38" rx="19" fill="url(#badge-bg)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Context Guard (30% / 50%)</text>
    </g>

    <!-- Pill 4: Background Haiku -->
    <g transform="translate(630, 0)">
      <rect width="230" height="38" rx="19" fill="url(#badge-bg)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#a855f7"/>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Haiku Restricted Worker ($0.20)</text>
    </g>

    <!-- Pill 5: Linux VM / WSL -->
    <g transform="translate(875, 0)">
      <rect width="205" height="38" rx="19" fill="url(#badge-bg)" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#64748b"/>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Linux VM / WSL Native</text>
    </g>
  </g>

  <!-- Bottom Command Snippet -->
  <g transform="translate(60, 222)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="500" fill="#64748b">
      Szybka instalacja: <tspan fill="#38bdf8">git clone https://github.com/NelexstarMain/ClaudeCode.git</tspan> <tspan fill="#94a3b8">&amp;&amp; cd ClaudeCode &amp;&amp; ./install.sh</tspan>
    </text>
  </g>
</svg>
