<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="term-shadow" x="-3%" y="-5%" width="106%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal Window Frame -->
  <g filter="url(#term-shadow)">
    <rect width="1100" height="230" rx="12" fill="url(#term-bg)"/>
    <rect x="0.5" y="0.5" width="1099" height="229" rx="11.5" fill="none" stroke="#30363d"/>
    
    <!-- Titlebar -->
    <rect width="1100" height="36" rx="12" fill="#21262d"/>
    <rect y="24" width="1100" height="12" fill="#21262d"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <text x="550" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">
      Claude Code Interactive StatusLine (statusline.py)
    </text>
  </g>

  <!-- Line 1: Healthy Session (< 30%) -->
  <g transform="translate(24, 66)">
    <rect width="1052" height="38" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1" stroke-opacity="0.6"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#c9d1d9">
      <tspan fill="#58a6ff" font-weight="700">[Claude 3.7 Sonnet]</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#f0883e">git:main*</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#3fb950" font-weight="700">CTX [##--------] 18%</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#8b949e">HYG:12/40m</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#3fb950" font-weight="700">TESTS:OK</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#79c0ff">$0.08</tspan>
    </text>
    <text x="1036" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#3fb950" text-anchor="end">● STREFA ZIELONA (OK)</text>
  </g>

  <!-- Line 2: Conscious Red Phase & Warning Context (30-50%) -->
  <g transform="translate(24, 118)">
    <rect width="1052" height="38" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1" stroke-opacity="0.6"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#c9d1d9">
      <tspan fill="#58a6ff" font-weight="700">[Claude 3.7 Sonnet]</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#f0883e">git:feat/tax-calc*</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#d29922" font-weight="700">CTX [####------] 38%</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#8b949e">HYG:31/40m</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#e3b341" font-weight="700">TESTS:RED (Conscious)</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#79c0ff">$0.21</tspan>
    </text>
    <text x="1036" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#d29922" text-anchor="end">▲ STREFA ŻÓŁTA (KONTROLA)</text>
  </g>

  <!-- Line 3: Critical Context (>= 50%) with Mandatory Wrapup -->
  <g transform="translate(24, 170)">
    <rect width="1052" height="38" rx="6" fill="#2d1215" stroke="#f85149" stroke-width="1" stroke-opacity="0.8"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#c9d1d9">
      <tspan fill="#58a6ff" font-weight="700">[Claude 3.7 Sonnet]</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#f0883e">git:feat/tax-calc*</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#f85149" font-weight="800">CTX [######----] 54% (/core-wrapup -&gt; /clear)</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#8b949e">HYG:39/40m</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#3fb950" font-weight="700">TESTS:OK</tspan>
      <tspan fill="#8b949e"> | </tspan>
      <tspan fill="#79c0ff">$0.39</tspan>
    </text>
    <text x="1036" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f85149" text-anchor="end">■ STREFA CZERWONA (ALERT)</text>
  </g>
</svg>
